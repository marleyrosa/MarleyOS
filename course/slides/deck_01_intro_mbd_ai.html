<h1 id="arquitetura-do-trem-de-for%C3%A7a-p2-h%C3%ADbrido">Arquitetura do Trem de Força P2 Híbrido</h1>
<p>A topologia <strong>P2 Paralela</strong> posiciona o motor elétrico (PMSM) entre a embreagem de desconexão K0 e o câmbio de dupla embreagem (e-DCT):</p>
<div class="card">
  <code>[ICE: 1.6L Miller] === [Embreagem K0] === [PMSM 238A] === [C1/C2 e-DCT] === [Eixo de Tração]</code>
</div>
<ul>
<li data-marpit-fragment="1"><strong>Modo EV Puro (K0 Aberta):</strong> Motor elétrico traciona o veículo até 60 km/h com zero emissões e silêncio total.</li>
<li data-marpit-fragment="2"><strong>Transição &amp; Partida (K0 Slip/Sync):</strong> O PMSM gira e arrasta o virabrequim do ICE até a rotação de ignição em menos de 250ms.</li>
<li data-marpit-fragment="3"><strong>Modo P2 Hybrid Boost (K0 Trancada):</strong> ICE no ponto ótimo de torque somado ao pico de torque elétrico (<mjx-container class="MathJax" jax="SVG"><svg style="vertical-align: -0.05ex;" xmlns="http://www.w3.org/2000/svg" width="8.547ex" height="1.557ex" role="img" focusable="false" viewBox="0 -666 3777.8 688"><g stroke="currentColor" fill="currentColor" stroke-width="0" transform="scale(1,-1)"><g data-mml-node="math"><g data-mml-node="mo"><path data-c="2248" d="M55 319Q55 360 72 393T114 444T163 472T205 482Q207 482 213 482T223 483Q262 483 296 468T393 413L443 381Q502 346 553 346Q609 346 649 375T694 454Q694 465 698 474T708 483Q722 483 722 452Q722 386 675 338T555 289Q514 289 468 310T388 357T308 404T224 426Q164 426 125 393T83 318Q81 289 69 289Q55 289 55 319ZM55 85Q55 126 72 159T114 210T163 238T205 248Q207 248 213 248T223 249Q262 249 296 234T393 179L443 147Q502 112 553 112Q609 112 649 141T694 220Q694 249 708 249T722 217Q722 153 675 104T555 55Q514 55 468 76T388 123T308 170T224 192Q164 192 125 159T83 84Q80 55 69 55Q55 55 55 85Z"></path></g><g data-mml-node="mn" transform="translate(1055.8,0)"><path data-c="31" d="M213 578L200 573Q186 568 160 563T102 556H83V602H102Q149 604 189 617T245 641T273 663Q275 666 285 666Q294 666 302 660V361L303 61Q310 54 315 52T339 48T401 46H427V0H416Q395 3 257 3Q121 3 100 0H88V46H114Q136 46 152 46T177 47T193 50T201 52T207 57T213 61V578Z"></path><path data-c="38" d="M70 417T70 494T124 618T248 666Q319 666 374 624T429 515Q429 485 418 459T392 417T361 389T335 371T324 363L338 354Q352 344 366 334T382 323Q457 264 457 174Q457 95 399 37T249 -22Q159 -22 101 29T43 155Q43 263 172 335L154 348Q133 361 127 368Q70 417 70 494ZM286 386L292 390Q298 394 301 396T311 403T323 413T334 425T345 438T355 454T364 471T369 491T371 513Q371 556 342 586T275 624Q268 625 242 625Q201 625 165 599T128 534Q128 511 141 492T167 463T217 431Q224 426 228 424L286 386ZM250 21Q308 21 350 55T392 137Q392 154 387 169T375 194T353 216T330 234T301 253T274 270Q260 2 <li data-marpit-fragment="4"><strong>Frenagem Regenerativa (K0 Aberta):</strong> O PMSM atua como gerador recarregando a bateria de alta tensão sem arrasto do motor a combustão.</li>
</ul>

<header>NexusMBD // AI-Native Powertrain Suite</header>
<h1 id="arquitetura-mbd-os-4-mains-solvers">Arquitetura MBD: Os 4 Mains Solvers</h1>
<p>No Simulink, o modelo é estritamente particionado para garantir determinação temporal e integridade de barramento:</p>
<div class="grid-2">
  <div class="card">
    <h3>1. COMUNICACAO (10ms)</h3>
    <p>Gerencia Inports, buffers de entrada e decodificação de quadros CAN DBC com verificação de paridade e timeout.</p>
  </div>
  <div class="card">
    <h3>2. SOFTECU (10ms)</h3>
    <p>Executa a lógica de controle embarcada (EMS - Energy Management Strategy), controle de lambda e split de torque.</p>
  </div>
  <div class="card card-amber">
    <h3>3. MDL - PLANTA FÍSICA (1ms)</h3>
    <p>Integração contínua das equações diferenciais da admissão (MAP), inércia mecânica e dinâmica térmica.</p>
  </div>
  <div class="card">
    <h3>4. OUT - TELEMETRIA (100ms)</h3>
    <p>Condicionamento dos sensores virtuais e empacotamento dos quadros telemétricos CAN para transmissão.</p>
  </div>
</div>
<footer>Módulo 1: Dinâmica Térmica ICE &amp; Arquitetura MBD</footer>
</section>

<header>NexusMBD // AI-Native Powertrain Suite</header>
<h1 id="ciclo-miller-efici%C3%AAncia-t%C3%A9rmica-m%C3%A1xima">Ciclo Miller: Eficiência Térmica Máxima</h1>
<p>Por que o <strong>Ciclo Miller com EIVC</strong> é ideal para híbridos?</p>
<div class="grid-2">
  <div class="card">
    <h3>Termodinâmica do EIVC</h3>
    <ul>
      <li>Fechamento antecipado da válvula de admissão.</li>
      <li>Taxa de expansão ($\varepsilon_e$) maior que a compressão efetiva ($\varepsilon_{c,\text{ef}}$).</li>
      <li>Menor temperatura de combustão &rarr; Redução drástica de $\text{NO}_x$.</li>
      <li>Elimina tendência à detonação (*Knock*).</li>
    </ul>
  </div>
  <div class="card card-amber">
    <h3>Sinergia com o Híbrido P2</h3>
    <ul>
      <li><strong>Desafio:</strong> Baixo torque em arrancadas.</li>
      <li><strong>Solução:</strong> O motor elétrico PMSM fornece torque instantâneo (<em>Torque Fill</em>).</li>
      <li>O ICE só é ativado quando o veículo já está em velocidade de cruzeiro e carga favorável.</li>
    </ul>
  </div>
</div>
<footer>Módulo 1: Dinâmica Térmica ICE &amp; Arquitetura MBD</footer>
</section>

  <div class="card">
    <strong>Entrada pela Borboleta ($\dot{m}_{ai}$):</strong>
    $$\dot{m}_{ai} = C_d A_{th}(\alpha) \frac{P_{amb}}{\sqrt{R T_{amb}}} \Psi\left(\frac{P_m}{P_{amb}}\right)$$
    Escoamento compressível isentrópico com transição sônica a $P_r \le 0.528$.
  </div>
  <div class="card">
    <strong>Bombeamento aos Cilindros ($\dot{m}_{ao}$):</strong>
    $$\dot{m}_{ao} = \frac{V_d \cdot N_e}{120 \cdot R \cdot T_m} \cdot \eta_v(N_e, P_m) \cdot P_m$$
    Abordagem <em>Speed-Density</em> dependente do rendimento volumétrico $\eta_v$.
  </div>
</div>

<header>NexusMBD // AI-Native Powertrain Suite</header>
<h1 id="mapeamento-bsfc--sweet-spot-41-efici%C3%AAncia">Mapeamento BSFC &amp; Sweet Spot (41% Eficiência)</h1>
<div class="grid-2">
  <div class="card">
    <h3>A Métrica BSFC</h3>
    $$\text{BSFC} = \frac{\dot{m}_f \text{ [g/h]}}{P_{\text{mech}} \text{ [kW]}} \quad [\text{g/kWh}]$$
    $$\eta_{th} = \frac{3600}{\text{BSFC} \cdot Q_{LHV}}$$
    Com $Q_{LHV} = 44\text{ MJ/kg}$:
    $$\text{BSFC} = 230\text{ g/kWh} \implies \mathbf{\eta_{th} = 41.0\%}$$
  </div>
  <div class="card card-amber">
    <h3>Zonas de Operação na ECU</h3>
    <ul>
      <li><span class="badge badge-green">SWEET SPOT:</span> $230 - 250\text{ g/kWh}$ (Alvo permanente do controle EMS).</li>
      <li><span class="badge badge-amber">ALTA CARGA:</span> $280 - 330\text{ g/kWh}$ (Fase de aceleração máxima).</li>
      <li><span class="badge badge-cyan">BAIXA CARGA:</span> $&gt; 450\text{ g/kWh}$ (Evitada desligando o ICE e desacoplando K0).</li>
    </ul>
  </div>
</div>
<footer>Módulo 1: Dinâmica Térmica ICE &amp; Arquitetura MBD</footer>
</section>

<h1 id="laborat%C3%B3rio-pr%C3%A1tico-guiado-hands-on-lab-1">Laboratório Prático Guiado (Hands-On Lab 1)</h1>
<div class="card">
  <strong>Objetivo:</strong> Simular um degrau de aceleração de 20% para 80% e auditar o atraso pneumático $\tau$ do coletor.
</div>
<h3 id="fluxo-de-trabalho-do-aluno">Fluxo de Trabalho do Aluno:</h3>
<ol>
<li>Executar a rotina de validação analítica: <code>python test_pipeline.py</code>.</li>
<li>Acessar o <strong>Cockpit de Telemetria</strong> em tempo real (<code>http://localhost:8080</code>).</li>
<li>Clicar em <strong><code>SIMULADOR // EXECUTAR MIL</code></strong> para rodar a simulação com a barra de progresso sincronizada.</li>
<li>Clicar no botão dedicado <strong><code>ABRIR SIMULINK</code></strong> para inspecionar os blocos internos do modelo <code>MIL_MarleyOS_Powertrain.slx</code>.</li>
