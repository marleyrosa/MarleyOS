<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 220" width="100%" height="100%">
  <style>
    .box { fill: #121826; stroke: #00d2ff; stroke-width: 2; rx: 8; }
    .box-em { fill: #121826; stroke: #00e676; stroke-width: 2; rx: 8; }
    .clutch { fill: #20152b; stroke: #ff9900; stroke-width: 2; stroke-dasharray: 4; rx: 4; }
    .text { fill: #e6edf3; font-family: monospace; font-size: 13px; font-weight: bold; text-anchor: middle; }
    .subtext { fill: #8b949e; font-family: sans-serif; font-size: 11px; text-anchor: middle; }
    .flow { stroke: #00d2ff; stroke-width: 2; marker-end: url(#arrow); }
  </style>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M 0 1 L 8 5 L 0 9 z" fill="#00d2ff" />
    </marker>
  </defs>

  <!-- ICE Block -->
  <rect x="20" y="50" width="140" height="90" class="box" />
  <text x="90" y="90" class="text">MOTOR ICE</text>
  <text x="90" y="112" class="subtext">1.5L Ciclo Miller</text>

  <!-- Clutch K0 -->
  <rect x="200" y="65" width="70" height="60" class="clutch" />
  <text x="235" y="95" class="text" fill="#ff9900">K0</text>
  <text x="235" y="112" class="subtext">Embreagem</text>

  <!-- Electric Motor PMSM -->
  <rect x="310" y="45" width="160" height="100" class="box-em" />
  <text x="390" y="90" class="text" fill="#00e676">PMSM (EM)</text>
  <text x="390" y="112" class="subtext">Controle FOC (Iq)</text>

  <!-- Transmission & Differential -->
  <rect x="520" y="50" width="150" height="90" class="box" />
  <text x="595" y="90" class="text">TRANSMISSÃO</text>
  <text x="595" y="112" class="subtext">Diferencial / Rodas</text>

  <!-- Fluxos Mecanicos -->
  <line x1="160" y1="95" x2="200" y2="95" class="flow" />
  <line x1="270" y1="95" x2="310" y2="95" class="flow" />
  <line x1="470" y1="95" x2="520" y2="95" class="flow" />
</svg>
