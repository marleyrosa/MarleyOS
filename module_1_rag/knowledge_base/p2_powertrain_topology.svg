<svg id="p2-svg-root" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1020 310" width="100%" height="100%">
  <style>
    .component-box { fill: #101624; stroke: #00d2ff; stroke-width: 2; rx: 6; }
    .box-em { fill: #101624; stroke: #00e676; stroke-width: 2; rx: 6; }
    .clutch-k0 { fill: #20152b; stroke: #ff9900; stroke-width: 2; stroke-dasharray: 4; rx: 4; }
    .text { fill: #e6edf3; font-family: monospace; font-size: 11px; font-weight: bold; text-anchor: middle; }
    .subtext { fill: #8b949e; font-family: sans-serif; font-size: 9px; text-anchor: middle; }
    .flow { stroke: #00d2ff; stroke-width: 2; marker-end: url(#arrow); opacity: 0.35; }
    
    /* Eixos Coaxiais e Engrenagens */
    .shaft-outer { stroke: #2e7d32; stroke-width: 14; stroke-linecap: round; opacity: 0.85; }
    .shaft-inner { stroke: #c62828; stroke-width: 7; stroke-linecap: round; }
    .gear-odd { fill: #b71c1c; stroke: #ef5350; stroke-width: 1.5; rx: 2; }
    .gear-even { fill: #1b5e20; stroke: #66bb6a; stroke-width: 1.5; rx: 2; }
    .selector { fill: #37474f; stroke: #cfd8dc; stroke-width: 1.5; rx: 2; }
    
    /* Embreagens Concêntricas DCT */
    .clutch-pack { fill: #1e2638; stroke: #78909c; stroke-width: 2; rx: 3; transition: all 0.25s ease; }
    
    /* Estados Reativos Dinâmicos */
    .active-ice { fill: rgba(0, 210, 255, 0.28) !important; stroke: #00d2ff !important; stroke-width: 3 !important; }
    .active-k0 { fill: rgba(255, 153, 0, 0.45) !important; stroke: #ff9900 !important; stroke-dasharray: none !important; stroke-width: 3 !important; }
    .active-em { fill: rgba(0, 230, 118, 0.28) !important; stroke: #00e676 !important; stroke-width: 3 !important; }
    .active-em-regen { fill: rgba(255, 23, 68, 0.28) !important; stroke: #ff1744 !important; stroke-width: 3 !important; }

    /* Animação de Fechamento de Pacote de Embreagem (Clutch 1 e 2) */
    .active-clutch1 {
      fill: rgba(239, 83, 80, 0.45) !important;
      stroke: #ff1744 !important;
      stroke-width: 3.5 !important;
      animation: pulse-c1 0.9s infinite alternate ease-in-out;
    }
    .active-clutch2 {
      fill: rgba(102, 187, 106, 0.45) !important;
      stroke: #00e676 !important;
      stroke-width: 3.5 !important;
      animation: pulse-c2 0.9s infinite alternate ease-in-out;
    }
    @keyframes pulse-c1 {
      0% { filter: drop-shadow(0 0 4px #ff1744); }
      100% { filter: drop-shadow(0 0 12px #ff5252); }
    }
    @keyframes pulse-c2 {
      0% { filter: drop-shadow(0 0 4px #00e676); }
      100% { filter: drop-shadow(0 0 12px #69f0ae); }
    }
  </style>

  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M 0 1 L 8 5 L 0 9 z" fill="#00d2ff" />
    </marker>
  </defs>

  <!-- SEÇÃO P2: ICE + K0 + PMSM -->
  <rect id="svg-ice" x="12" y="110" width="115" height="90" class="component-box" />
  <text x="69" y="152" class="text">MOTOR ICE</text>
  <text x="69" y="172" class="subtext">1.5L Miller</text>

  <rect id="svg-k0" x="150" y="125" width="55" height="60" class="clutch-k0" />
  <text x="177" y="155" class="text" fill="#ff9900">K0</text>
  <text x="177" y="170" class="subtext">Clutch</text>

  <rect id="svg-em" x="228" y="100" width="135" height="110" class="box-em" />
  <text id="svg-em-title" x="295" y="152" class="text" fill="#00e676">PMSM (EM)</text>
  <text x="295" y="172" class="subtext">Rotor P2</text>

  <!-- LINHAS DE ENTRADA P2 -->
  <line x1="127" y1="155" x2="150" y2="155" class="flow" />
  <line x1="205" y1="155" x2="228" y2="155" class="flow" />
  <line x1="363" y1="155" x2="400" y2="155" class="flow" style="stroke-width: 3.5; opacity: 0.9;" />

  <!-- CARCAÇA DA TRANSMISSÃO e-DCT -->
  <rect x="400" y="25" width="605" height="260" rx="8" fill="#0b0f19" stroke="rgba(0, 210, 255, 0.4)" stroke-width="1.8" stroke-dasharray="3 3" />
  <text x="702" y="45" class="text" fill="#00d2ff">CAIXA e-DCT // ARQUITETURA COAXIAL DUAL-SHAFT</text>

  <!-- MULTIDISCOS CONCÊNTRICOS DCT (CLUTCH 1 E CLUTCH 2) -->
  <!-- Carcaça do Tambor de Embreagem -->
  <path d="M 400 95 L 430 95 L 430 215 L 400 215" fill="none" stroke="#cfd8dc" stroke-width="3" />
  
  <!-- Clutch 1 (Externa / Marchas Ímpares) -->
  <rect id="svg-clutch1-top" x="432" y="70" width="40" height="32" class="clutch-pack" />
  <rect id="svg-clutch1-bot" x="432" y="208" width="40" height="32" class="clutch-pack" />
  <text x="452" y="89" class="text" fill="#ef5350" style="font-size: 9px;">C1</text>
  <text x="452" y="227" class="text" fill="#ef5350" style="font-size: 9px;">C1</text>

  <!-- Clutch 2 (Interna / Marchas Pares e Ré) -->
  <rect id="svg-clutch2-top" x="438" y="108" width="34" height="26" class="clutch-pack" />
  <rect id="svg-clutch2-bot" x="438" y="176" width="34" height="26" class="clutch-pack" />
  <text x="455" y="124" class="text" fill="#66bb6a" style="font-size: 9px;">C2</text>
  <text x="455" y="192" class="text" fill="#66bb6a" style="font-size: 9px;">C2</text>

  <!-- EIXO VERDE (OUTER SHAFT - OCO - PARES) -->
  <line x1="472" y1="155" x2="685" y2="155" class="shaft-outer" />
  <!-- EIXO VERMELHO (INNER SHAFT - SÓLIDO - ÍMPARES) -->
  <line x1="472" y1="155" x2="945" y2="155" class="shaft-inner" />

  <!-- EIXO SECUNDÁRIO SUPERIOR (OUTPUT SHAFT 1) -->
  <line x1="530" y1="80" x2="945" y2="80" stroke="#78909c" stroke-width="5" stroke-linecap="round" />
  <!-- EIXO SECUNDÁRIO INFERIOR (OUTPUT SHAFT 2) -->
  <line x1="530" y1="230" x2="945" y2="230" stroke="#78909c" stroke-width="5" stroke-linecap="round" />

  <!-- ENGRENAGENS E SINCRONIZADORES (CONFORME DIAGRAMA) -->
  <!-- Marcha Ré (R) -->
  <rect id="gear-r" x="550" y="58" width="28" height="44" class="gear-even" />
  <text x="564" y="84" class="text" style="font-size:10px;">R</text>

  <!-- 6ª Marcha -->
  <rect id="gear-6" x="625" y="52" width="28" height="56" class="gear-even" />
  <text x="639" y="84" class="text" style="font-size:10px;">6</text>

  <!-- Seletor Superior 1 -->
  <rect id="sel-top-1" x="590" y="70" width="22" height="20" class="selector" />

  <!-- 5ª Marcha -->
  <rect id="gear-5" x="880" y="48" width="30" height="64" class="gear-odd" />
  <text x="895" y="84" class="text" style="font-size:10px;">5</text>

  <!-- Seletor Superior 2 -->
  <rect id="sel-top-2" x="835" y="70" width="24" height="20" class="selector" />

  <!-- 2ª Marcha -->
  <rect id="gear-2" x="550" y="208" width="28" height="44" class="gear-even" />
  <text x="564" y="234" class="text" style="font-size:10px;">2</text>

  <!-- 4ª Marcha -->
  <rect id="gear-4" x="625" y="202" width="28" height="56" class="gear-even" />
  <text x="639" y="234" class="text" style="font-size:10px;">4</text>

  <!-- Seletor Inferior 1 -->
  <rect id="sel-bot-1" x="590" y="220" width="22" height="20" class="selector" />

  <!-- 3ª Marcha -->
  <rect id="gear-3" x="715" y="196" width="30" height="68" class="gear-odd" />
  <text x="730" y="234" class="text" style="font-size:10px;">3</text>

  <!-- 1ª Marcha -->
  <rect id="gear-1" x="875" y="188" width="34" height="84" class="gear-odd" />
  <text x="892" y="234" class="text" style="font-size:10px;">1</text>

  <!-- Seletor Inferior 2 -->
  <rect id="sel-bot-2" x="795" y="220" width="24" height="20" class="selector" />

  <!-- LEGENDA DE IDENTIFICAÇÃO -->
  <rect x="420" y="268" width="12" height="12" fill="#c62828" rx="2" />
  <text x="480" y="278" class="subtext" fill="#ef5350">Eixo Sólido (C1: 1ª/3ª/5ª)</text>

  <rect x="560" y="268" width="12" height="12" fill="#2e7d32" rx="2" />
  <text x="618" y="278" class="subtext" fill="#66bb6a">Eixo Oco (C2: 2ª/4ª/6ª/R)</text>
</svg>
