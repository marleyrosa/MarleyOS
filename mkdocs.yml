site_name: NexusMBD // AI-Native Powertrain Engineering Suite
site_description: Apostila Técnica e Documentação de Model-Based Design Automotivo com os 4 Pilares de Inteligência Artificial (MCP, RAG, Agents, Fine-Tuning).
site_author: Marley Rosa Luciano
repo_url: https://github.com/marleyrosa/MarleyOS
repo_name: marleyrosa/MarleyOS

theme:
  name: material
  language: pt-BR
  palette:
    # Palette toggle for automatic/dark mode
    - scheme: slate
      primary: cyan
      accent: amber
      toggle:
        icon: material/brightness-4
        name: Alternar para modo claro
    - scheme: default
      primary: cyan
      accent: amber
      toggle:
        icon: material/brightness-7
        name: Alternar para modo escuro
  features:
    - navigation.tabs
    - navigation.sections
    - navigation.expand
    - navigation.top
    - navigation.tracking
    - search.suggest
    - search.highlight
    - content.code.copy
    - content.code.annotate

extra_css:
  - https://cdn.jsdelivr.net/npm/katex@0.16.8/dist/katex.min.css

extra_javascript:
  - https://cdn.jsdelivr.net/npm/katex@0.16.8/dist/katex.min.js
  - https://cdn.jsdelivr.net/npm/katex@0.16.8/dist/contrib/auto-render.min.js

markdown_extensions:
  - admonition
  - pymdownx.details
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  - pymdownx.highlight:
      anchor_linenums: true
      line_spans: __span
      pygments_lang_class: true
  - pymdownx.inlinehilite
  - pymdownx.snippets
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.arithmatex:
      generic: true
  - tables
  - attr_list
  - md_in_html

nav:
  - Início: index.md
  - "Plano Mestre do Curso": COURSE_CURRICULUM.md
  - Apostila Técnica:
      - "Capítulo 1: Dinâmica ICE & Ciclo Miller": course/apostilas/01_ice_powertrain.md
      - "Capítulo 2: Máquinas PMSM & Controle FOC": course/apostilas/02_bev_foc_traction.md
      - "Capítulo 3: Híbrido P2, K0 & e-DCT": course/apostilas/03_hev_p2_architecture.md
      - "Capítulo 4: [MCP] Servidor JSON-RPC & CAN DBC": course/apostilas/04_mcp_can_telemetry.md
      - "Capítulo 5: [RAG] Busca Híbrida & Árvores DTC": course/apostilas/05_rag_knowledge_base.md
      - "Capítulo 6: [AGENTS] Calibração Simulink MIL": course/apostilas/06_agents_simulink_mil.md
      - "Capítulo 7: [FINE-TUNING] Datasets & ISO 26262": course/apostilas/07_finetuning_safety_audit.md
      - "Capítulo 8: Capstone & Exame de Certificação": course/apostilas/08_capstone_certification.md
  - Slides Executivos:
      - "Deck 1: Visão Geral & MBD": course/slides/deck_01_intro_mbd_ai.md
      - "Deck 2: Eletrificação BEV & Híbrido P2": course/slides/deck_02_bev_hev.md
      - "Deck 3: Os 4 Pilares de IA & Certificação": course/slides/deck_03_ai_pillars.md
  - Laboratórios Práticos:
      - "Guia de Laboratório MIL/MCP": LAB_GUIDE_MBD_MCP.md
      - "Exercícios Resolvidos": EXERCICIOS_RESOLVIDOS.md
  - Sistema & Cockpit:
      - "Cockpit & Arquitetura": SISTEMA_OPERACIONAL.md
