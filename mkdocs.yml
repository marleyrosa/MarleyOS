site_name: NexusMBD // AI-Native Powertrain Engineering Suite
site_description: Technical Handbooks & Model-Based Design Powertrain Engineering Suite powered by the 4 AI Pillars (MCP, RAG, Agents, Fine-Tuning).
site_author: Marley Rosa Luciano
repo_url: https://github.com/marleyrosa/MarleyOS
repo_name: marleyrosa/MarleyOS

theme:
  name: material
  language: en
  palette:
    # Palette toggle for automatic/dark mode
    - scheme: slate
      primary: cyan
      accent: amber
      toggle:
        icon: material/brightness-4
        name: Switch to light mode
    - scheme: default
      primary: cyan
      accent: amber
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
  features:
    - navigation.tabs
    - navigation.sections
    - navigation.expand
    - navigation.top
    - navigation.tracking
    - search.suggest
    - search.highlight
    - content.code.copy
    - content.code.annotate

extra_css:
  - https://cdn.jsdelivr.net/npm/katex@0.16.8/dist/katex.min.css

extra_javascript:
  - https://cdn.jsdelivr.net/npm/katex@0.16.8/dist/katex.min.js
  - https://cdn.jsdelivr.net/npm/katex@0.16.8/dist/contrib/auto-render.min.js

markdown_extensions:
  - admonition
  - pymdownx.details
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  - pymdownx.highlight:
      anchor_linenums: true
      line_spans: __span
      pygments_lang_class: true
  - pymdownx.inlinehilite
  - pymdownx.snippets
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.arithmatex:
      generic: true
  - tables
  - attr_list
  - md_in_html

nav:
  - Home: index.md
  - "Master Curriculum": COURSE_CURRICULUM.md
  - Technical Handbooks:
      - "Chapter 1: Thermal ICE Dynamics & Miller Cycle": course/apostilas/01_ice_powertrain.md
      - "Chapter 2: PMSM Machines & FOC Control": course/apostilas/02_bev_foc_traction.md
      - "Chapter 3: P2 Hybrid, K0 Clutch & e-DCT": course/apostilas/03_hev_p2_architecture.md
      - "Chapter 4: [MCP] JSON-RPC Server & CAN DBC": course/apostilas/04_mcp_can_telemetry.md
      - "Chapter 5: [RAG] Hybrid Search & DTC Fault Trees": course/apostilas/05_rag_knowledge_base.md
      - "Chapter 6: [AGENTS] Simulink MIL Calibration": course/apostilas/06_agents_simulink_mil.md
      - "Chapter 7: [FINE-TUNING] Datasets & ISO 26262": course/apostilas/07_finetuning_safety_audit.md
      - "Chapter 8: Capstone & Certification Exam": course/apostilas/08_capstone_certification.md
  - Executive Slides:
      - "Master Presentation Full (English)": course/slides/deck_master_en.md
      - "Apresentação Master (Português)": course/slides/deck_master_pt.md
      - "Deck 1: MBD Overview": course/slides/deck_01_intro_mbd_ai.md
      - "Deck 2: BEV Electrification & P2 HEV": course/slides/deck_02_bev_hev.md
      - "Deck 3: The 4 AI Pillars & Certification": course/slides/deck_03_ai_pillars.md
  - Practical Labs:
      - "MIL/MCP Laboratory Guide": LAB_GUIDE_MBD_MCP.md
      - "Solved Engineering Exercises": EXERCICIOS_RESOLVIDOS.md
  - System & Cockpit:
      - "Cockpit Architecture & Guide": SISTEMA_OPERACIONAL.md
